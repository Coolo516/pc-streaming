<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Desktop</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--fg:#e8eaf0;--mut:#8b93a7;--acc:#4f8cff;--err:#ff6b6b;--bd:#2a2f3a}
  @media (prefers-color-scheme: light){:root{--bg:#f3f5f9;--card:#fff;--fg:#14171f;--mut:#5d667a;--bd:#dfe3ec}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #login{min-height:100%;display:grid;place-items:center;padding:20px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:32px;width:100%;max-width:440px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .logo{font-size:36px;margin-bottom:6px}
  h1{margin:0 0 6px;font-size:22px}
  p{color:var(--mut);margin:0 0 22px;font-size:14px;line-height:1.5}
  #code{width:100%;font:600 26px ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;text-align:center;text-transform:uppercase;padding:14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);outline:none}
  #code:focus{border-color:var(--acc)}
  button{font:600 15px system-ui,sans-serif;border:0;border-radius:10px;cursor:pointer;color:#fff;background:var(--acc)}
  #go{width:100%;padding:14px;margin-top:14px}
  #go:disabled{opacity:.6;cursor:wait}
  #msg{min-height:20px;margin-top:14px;font-size:14px;color:var(--mut)}
  #msg.err{color:var(--err)}
  small{display:block;margin-top:18px;color:var(--mut);font-size:12px;line-height:1.5}
  #stream{position:fixed;inset:0;background:#000;display:none}
  canvas{width:100%;height:100%;object-fit:contain;display:block;outline:none;cursor:default}
  #bar{position:fixed;top:10px;right:10px;display:flex;gap:8px;align-items:center;opacity:.3;transition:opacity .2s;color:#fff;font-size:13px}
  #bar:hover{opacity:1}
  #bar button{padding:7px 12px;font-size:13px;background:#333}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <div class="logo">🖥️</div>
    <h1>Connect to a computer</h1>
    <p>Run the host app on the computer you want to control, then enter the connection code it shows.</p>
    <input id="code" maxlength="11" placeholder="XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus>
    <button id="go">Connect</button>
    <div id="msg"></div>
    <small>The host must approve each connection. Your screen and input go directly between the two computers, encrypted.</small>
  </div>
</div>

<div id="stream">
  <canvas id="screen" tabindex="0"></canvas>
  <div id="bar"><span id="disp"></span><span id="fps"></span><button id="sw" title="Shortcut: Ctrl+1">Switch display</button><button id="fs">Fullscreen</button><button id="dc">Disconnect</button></div>
  <div id="toast"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const NTFY = 'https://ntfy.sh/';
const canvas = $('screen'), ctx = canvas.getContext('2d');
let pc, dc, es, timer, live = false, cur = null, busy = false, frames = 0, fpsTimer;
let switched = false, dispCount = 1, swallow = false, toastTimer;
function toast(t) {
  const el = $('toast'); el.textContent = t; el.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 1800);
}
function switchDisplay() { switched = true; send({ t: 'switch' }); }

function setMsg(t, err) { $('msg').textContent = t || ''; $('msg').className = err ? 'err' : ''; }

function end(msg, err = true) {
  clearTimeout(timer); clearInterval(fpsTimer);
  live = false;
  try { es && es.close(); } catch {}
  try { dc && dc.close(); } catch {}
  try { pc && pc.close(); } catch {}
  if (document.fullscreenElement) document.exitFullscreen();
  $('stream').style.display = 'none';
  $('login').style.display = 'grid';
  $('go').disabled = false;
  setMsg(msg, err);
}

const gathered = p => new Promise(res => {
  if (p.iceGatheringState === 'complete') return res();
  const t = setTimeout(res, 5000);
  p.addEventListener('icegatheringstatechange', () => {
    if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); }
  });
});

async function connect() {
  const code = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 10) return setMsg('Codes are 10 characters, like K7M2Q-X9P4R.', true);
  $('go').disabled = true;
  setMsg('Connecting…');

  const topic = NTFY + 'rdesk-v1-' + code.toLowerCase();
  const id = Math.random().toString(36).slice(2) + Date.now().toString(36);

  try {
    // 1) Ask the host for its network config (STUN + optional TURN relay). Keeps relay credentials off this public site.
    es = new EventSource(topic + '/sse');
    await new Promise((res, rej) => {
      es.addEventListener('open', res, { once: true });
      es.onerror = () => rej(new Error('Could not reach the signaling service.'));
    });
    es.onerror = null;
    const ice = await new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('Host not found. Check the code and that the host app is running.')), 15000);
      es.onmessage = ev => {
        let e, m;
        try { e = JSON.parse(ev.data); m = JSON.parse(e.message); } catch { return; }
        if (e.event === 'message' && m.type === 'config' && m.id === id) { clearTimeout(t); res(m.ice); }
      };
      fetch(topic, { method: 'POST', body: JSON.stringify({ type: 'hello', id }) }).catch(rej);
    });
    pc = new RTCPeerConnection({ iceServers: ice });
    dc = pc.createDataChannel('screen');
    dc.binaryType = 'arraybuffer';
    dc.onmessage = onFrame;
    dc.onopen = () => {
      live = true; clearTimeout(timer); setMsg('');
      $('login').style.display = 'none'; $('stream').style.display = 'block'; canvas.focus();
      fpsTimer = setInterval(() => { $('fps').textContent = frames + ' fps'; frames = 0; }, 1000);
      try { es.close(); } catch {}
    };
    dc.onclose = () => { if (live) end('Disconnected.'); };
    pc.onconnectionstatechange = () => {
      if (['failed', 'closed'].includes(pc.connectionState)) end(live ? 'Connection lost.' : 'Could not connect. A strict network may need a TURN relay (see the host setup notes).');
    };

    // 2) Wait for the host's answer
    es.onmessage = async ev => {
      let e, m;
      try { e = JSON.parse(ev.data); m = JSON.parse(e.message); } catch { return; }
      if (e.event !== 'message' || m.id !== id) return;
      if (m.type === 'answer') await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
      else if (m.type === 'denied') end('The host declined the connection.');
    };

    await pc.setLocalDescription(await pc.createOffer());
    await gathered(pc);
    await fetch(topic, { method: 'POST', body: JSON.stringify({ type: 'offer', id, sdp: pc.localDescription.sdp }) });
    setMsg('Connecting to your computer…');
    timer = setTimeout(() => { if (!live) end('Could not connect. Your network may need a relay (see the host setup notes).'); }, 30000);
  } catch (err) {
    end(err.message || 'Connection failed.');
  }
}

// Frames arrive as chunks: [frameId u32][index u16][total u16][jpeg bytes]
async function onFrame(e) {
  if (typeof e.data === 'string') {
    try {
      const m = JSON.parse(e.data);
      if (m.type === 'display') {
        dispCount = m.count;
        $('disp').textContent = m.count > 1 ? 'Display ' + m.index + '/' + m.count : '';
        if (switched) toast(m.count > 1 ? 'Display ' + m.index + ' of ' + m.count : 'Only one display found');
        switched = false;
      }
    } catch {}
    return;
  }
  const v = new DataView(e.data);
  const fid = v.getUint32(0), idx = v.getUint16(4), total = v.getUint16(6);
  if (!cur || cur.fid !== fid) cur = { fid, parts: new Array(total), got: 0, total };
  if (!cur.parts[idx]) { cur.parts[idx] = new Uint8Array(e.data, 8); cur.got++; }
  if (cur.got < cur.total) return;
  const blob = new Blob(cur.parts, { type: 'image/jpeg' });
  cur = null;
  if (busy) return;
  busy = true;
  try {
    const bmp = await createImageBitmap(blob);
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) { canvas.width = bmp.width; canvas.height = bmp.height; }
    ctx.drawImage(bmp, 0, 0); bmp.close(); frames++;
  } catch {}
  busy = false;
}

// ---- remote input ----
const send = o => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); };
function pos(e) {
  const r = canvas.getBoundingClientRect();
  const s = Math.min(r.width / canvas.width, r.height / canvas.height);
  const w = canvas.width * s, h = canvas.height * s;
  const x = (e.clientX - r.left - (r.width - w) / 2) / w;
  const y = (e.clientY - r.top - (r.height - h) / 2) / h;
  return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
}
let pend = null;
canvas.addEventListener('mousemove', e => {
  const first = pend === null; pend = pos(e);
  if (first) requestAnimationFrame(() => { send({ t: 'move', ...pend }); pend = null; });
});
canvas.addEventListener('mousedown', e => { e.preventDefault(); canvas.focus(); send({ t: 'mouse', a: 'down', b: e.button, ...pos(e) }); });
canvas.addEventListener('mouseup', e => { e.preventDefault(); send({ t: 'mouse', a: 'up', b: e.button, ...pos(e) }); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); send({ t: 'wheel', dy: e.deltaY }); }, { passive: false });
const isOne = e => e.code === 'Digit1' || e.code === 'Numpad1';
canvas.addEventListener('keydown', e => {
  e.preventDefault();
  if (e.ctrlKey && isOne(e)) { if (!e.repeat) switchDisplay(); swallow = true; return; }  // Ctrl+1 = next display
  send({ t: 'key', a: 'down', k: e.key });
});
canvas.addEventListener('keyup', e => {
  e.preventDefault();
  if (swallow && isOne(e)) { swallow = false; return; }
  send({ t: 'key', a: 'up', k: e.key });
});

$('go').onclick = connect;
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
$('code').addEventListener('input', e => {
  let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
  e.target.value = v.length > 5 ? v.slice(0, 5) + '-' + v.slice(5) : v;
});
$('sw').onclick = () => { switchDisplay(); canvas.focus(); };
$('fs').onclick = async () => {
  await $('stream').requestFullscreen();
  try { await navigator.keyboard?.lock?.(); } catch {}  // lets Alt+Tab, Esc etc. reach the host (Chrome/Edge)
  canvas.focus();
};
$('dc').onclick = () => end('Disconnected.', false);
</script>
</body>
</html>
