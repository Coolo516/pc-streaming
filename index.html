<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<meta name="color-scheme" content="dark">
<title>Remote Desktop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖥️%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#070a14; --fg:#eef1fb; --mut:#8e98b8; --acc:#6c8cff; --acc2:#a46bff; --ok:#3ddc97; --err:#ff6b81;
    --glass:rgba(18,22,40,.62); --line:rgba(255,255,255,.09);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* ---------- animated background ---------- */
  #scene{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(1200px 700px at 50% -10%,#14193a 0%,transparent 60%),var(--bg)}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
  .b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,#4a63ff,transparent 65%);animation:f1 22s ease-in-out infinite alternate}
  .b2{width:42vmax;height:42vmax;right:-14vmax;top:8vmax;background:radial-gradient(circle,#9a4dff,transparent 65%);animation:f2 26s ease-in-out infinite alternate}
  .b3{width:40vmax;height:40vmax;left:20vmax;bottom:-22vmax;background:radial-gradient(circle,#13c2c2,transparent 65%);opacity:.38;animation:f3 30s ease-in-out infinite alternate}
  @keyframes f1{to{transform:translate(18vmax,10vmax) scale(1.15)}}
  @keyframes f2{to{transform:translate(-16vmax,12vmax) scale(.9)}}
  @keyframes f3{to{transform:translate(-14vmax,-10vmax) scale(1.2)}}
  #bg{position:absolute;inset:0;width:100%;height:100%}
  #scene::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 45%,rgba(3,5,12,.65) 100%)}
  body.live #scene{display:none}

  /* ---------- login ---------- */
  #login{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding:24px;overflow:auto}
  .card{width:100%;max-width:460px;text-align:center;padding:38px 34px 28px;border-radius:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),var(--glass);
    border:1px solid var(--line);
    -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset,0 1px 0 rgba(255,255,255,.12) inset;
    animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
  .card.shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  .logo{width:74px;height:74px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    box-shadow:0 12px 36px rgba(108,140,255,.45),0 1px 0 rgba(255,255,255,.35) inset;
    animation:float 5s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  .logo svg{width:38px;height:38px}
  h1{margin:0 0 8px;font-size:28px;font-weight:700;letter-spacing:-.02em;
    background:linear-gradient(90deg,#fff,#b9c6ff 40%,#d9b8ff 70%,#fff);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
  @keyframes shine{to{background-position:200% center}}
  .sub{margin:0 0 26px;color:var(--mut);font-size:14.5px;line-height:1.6}

  .field{position:relative}
  #code{width:100%;font:600 27px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;text-align:center;
    text-transform:uppercase;padding:17px 14px;border-radius:14px;color:var(--fg);outline:none;
    background:rgba(5,8,18,.55);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s,background .2s}
  #code::placeholder{color:rgba(142,152,184,.35)}
  #code:hover{border-color:rgba(255,255,255,.18)}
  #code:focus{border-color:var(--acc);background:rgba(5,8,18,.75);
    box-shadow:0 0 0 4px rgba(108,140,255,.18),0 0 30px rgba(108,140,255,.25)}

  button{font:inherit}
  #go{position:relative;width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;cursor:pointer;overflow:hidden;
    font-size:16px;font-weight:650;letter-spacing:.01em;color:#fff;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    box-shadow:0 10px 30px rgba(108,140,255,.4),0 1px 0 rgba(255,255,255,.3) inset;
    transition:transform .15s,box-shadow .2s,filter .2s}
  #go::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    transform:translateX(-120%);transition:transform .7s}
  #go:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 40px rgba(108,140,255,.55),0 1px 0 rgba(255,255,255,.3) inset}
  #go:hover:not(:disabled)::before{transform:translateX(120%)}
  #go:active:not(:disabled){transform:translateY(0) scale(.99)}
  #go:focus-visible{outline:2px solid #fff;outline-offset:3px}
  #go:disabled{cursor:progress;filter:saturate(.7) brightness(.92)}
  #go .lbl{position:relative}
  #go.loading .lbl{opacity:0}
  #go.loading::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
    border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  #msg{min-height:24px;margin-top:16px;font-size:14px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:9px;line-height:1.4}
  #msg.busy::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--acc);animation:spin .8s linear infinite}
  #msg.err{color:var(--err)}
  #msg.err::before{content:"!";flex:none;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--err);color:#12040a;font-size:11px;font-weight:800}
  #msg.info{color:var(--ok)}

  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
  .chip{font-size:12px;color:var(--mut);padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .keys{margin-top:16px;font-size:12px;color:var(--mut);line-height:2}
  kbd{font:600 11px ui-monospace,Menlo,Consolas,monospace;color:var(--fg);padding:3px 7px;border-radius:6px;
    background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-width:2px}

  /* ---------- stream ---------- */
  #stream{position:fixed;inset:0;z-index:5;background:#000;display:none}
  #stream.show{display:block;animation:fade .5s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  canvas#screen{width:100%;height:100%;object-fit:contain;display:block;outline:none;cursor:default}
  #bar{position:fixed;top:12px;left:12px;display:flex;align-items:center;gap:8px;padding:6px 13px 6px 11px;border-radius:999px;
    color:#fff;font:600 13px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;
    background:rgba(8,10,20,.55);border:1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:.75;pointer-events:none}
  #bar::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  #toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,12px);padding:11px 20px;border-radius:12px;font-size:14px;font-weight:550;color:#fff;
    background:rgba(8,10,20,.78);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:480px){.card{padding:30px 20px 22px}#code{font-size:23px}h1{font-size:24px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="scene" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <canvas id="bg"></canvas>
</div>

<main id="login">
  <div class="card" id="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="12.5" rx="2.2"/><path d="M8 20.5h8M12 16.5v4"/><path d="m9.5 10.2 2 2 3.3-3.6" stroke-width="1.9"/></svg>
    </div>
    <h1>Remote Desktop</h1>
    <p class="sub">Run the host app on the computer you want to control, then enter the connection code it shows.</p>
    <div class="field">
      <input id="code" maxlength="11" placeholder="XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Connection code" autofocus>
    </div>
    <button id="go"><span class="lbl">Connect</span></button>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="chips">
      <span class="chip">🔒 Encrypted</span><span class="chip">⚡ Up to 60 FPS</span><span class="chip">🌍 Works anywhere</span>
    </div>
    <div class="keys">While connected &nbsp; <kbd>Ctrl</kbd>+<kbd>1</kbd> switch display &nbsp; <kbd>Ctrl</kbd>+<kbd>2</kbd> fullscreen &nbsp; <kbd>Ctrl</kbd>+<kbd>3</kbd> disconnect &nbsp; <kbd>Ctrl</kbd>+<kbd>4</kbd> game mode</div>
  </div>
</main>

<div id="stream">
  <canvas id="screen" tabindex="0"></canvas>
  <div id="bar"><span id="fps">0 FPS</span></div>
  <div id="toast"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const NTFY = 'https://ntfy.sh/';
const canvas = $('screen'), ctx = canvas.getContext('2d');
let pc, dc, ws, es, live = false, mode = '', gen = 0, timers = [];
let cur = null, busy = false, frames = 0, fpsTimer, switched = false, toastTimer;
let pend = null, game = false, relX = 0, relY = 0, relPending = false;
const swallowed = new Set();

/* ================= animated background ================= */
const bg = $('bg'), bctx = bg.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, parts = [], bgRun = false;
const mouse = { x: -9999, y: -9999 };

function sizeBg() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  bg.width = W * dpr; bg.height = H * dpr;
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.min(120, Math.floor(W * H / 13000));
  parts = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4, r: Math.random() * 1.6 + .7
  }));
  if (reduceMotion) drawBg();
}
function drawBg() {
  bctx.clearRect(0, 0, W, H);
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    for (let j = i + 1; j < parts.length; j++) {
      const q = parts[j], dx = p.x - q.x, dy = p.y - q.y, d = dx * dx + dy * dy;
      if (d < 16900) {
        bctx.strokeStyle = 'rgba(140,165,255,' + ((1 - d / 16900) * .22).toFixed(3) + ')';
        bctx.lineWidth = 1; bctx.beginPath(); bctx.moveTo(p.x, p.y); bctx.lineTo(q.x, q.y); bctx.stroke();
      }
    }
    const mx = p.x - mouse.x, my = p.y - mouse.y, md = mx * mx + my * my;
    if (md < 28900) {  // lines to the cursor
      bctx.strokeStyle = 'rgba(190,150,255,' + ((1 - md / 28900) * .5).toFixed(3) + ')';
      bctx.beginPath(); bctx.moveTo(p.x, p.y); bctx.lineTo(mouse.x, mouse.y); bctx.stroke();
    }
    bctx.fillStyle = 'rgba(200,215,255,.85)';
    bctx.beginPath(); bctx.arc(p.x, p.y, p.r, 0, 6.2832); bctx.fill();
  }
}
function tickBg() {
  if (!bgRun) return;
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
    const dx = p.x - mouse.x, dy = p.y - mouse.y, d = dx * dx + dy * dy;
    if (d < 14400 && d > 1) { const k = (1 - d / 14400) * 1.2 / Math.sqrt(d); p.x += dx * k; p.y += dy * k; }  // gently pushed away
  }
  drawBg();
  requestAnimationFrame(tickBg);
}
function startBg() { if (bgRun || reduceMotion) return; bgRun = true; requestAnimationFrame(tickBg); }
function stopBg() { bgRun = false; }
addEventListener('resize', () => { if (!live) sizeBg(); });
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });
sizeBg(); startBg();

/* ================= UI helpers ================= */
function setMsg(t, kind = 'busy') { const m = $('msg'); m.textContent = t || ''; m.className = t ? kind : ''; }
function shake() { const c = $('card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}

function end(msg, err = true) {
  gen++;                                   // invalidates every callback of the old session
  timers.forEach(clearTimeout); timers = []; clearInterval(fpsTimer);
  live = false; mode = ''; cur = null; pend = null; swallowed.clear();
  try { document.exitPointerLock(); } catch {}
  game = false;
  for (const o of [es, dc, pc, ws]) { try { o && o.close(); } catch {} }
  es = dc = pc = ws = null;
  if (document.fullscreenElement) document.exitFullscreen();
  $('stream').classList.remove('show');
  document.body.classList.remove('live');
  $('go').disabled = false; $('go').classList.remove('loading');
  setMsg(msg, err ? 'err' : 'info');
  if (err && msg) shake();
  sizeBg(); startBg();
}

function goLive(kind, my) {
  if (live || my !== gen) return false;
  live = true; mode = kind;
  timers.forEach(clearTimeout); timers = [];
  setMsg('');
  $('go').classList.remove('loading');
  document.body.classList.add('live'); stopBg();
  $('stream').classList.add('show'); canvas.focus();
  fpsTimer = setInterval(() => { $('fps').textContent = frames + ' FPS'; frames = 0; }, 1000);
  try { es && es.close(); } catch {}
  return true;
}

const gathered = p => new Promise(res => {
  if (p.iceGatheringState === 'complete') return res();
  const t = setTimeout(res, 5000);
  p.addEventListener('icegatheringstatechange', () => {
    if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); }
  });
});

/* ================= streaming ================= */
async function draw(blob) {
  if (busy) return;
  busy = true;
  try {
    const bmp = await createImageBitmap(blob);
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) { canvas.width = bmp.width; canvas.height = bmp.height; }
    ctx.drawImage(bmp, 0, 0); bmp.close(); frames++;
  } catch {}
  busy = false;
}

function handleCtl(str) {
  try {
    const m = JSON.parse(str);
    if (m.type === 'display') {
      if (switched) toast(m.count > 1 ? 'Display ' + m.index + ' of ' + m.count : 'Only one display found');
      switched = false;
    }
  } catch {}
}

// Direct mode: frames arrive as chunks [frameId u32][index u16][total u16][jpeg bytes]
function onRtcData(e) {
  if (typeof e.data === 'string') return handleCtl(e.data);
  const v = new DataView(e.data);
  const fid = v.getUint32(0), idx = v.getUint16(4), total = v.getUint16(6);
  if (!cur || cur.fid !== fid) cur = { fid, parts: new Array(total), got: 0, total };
  if (!cur.parts[idx]) { cur.parts[idx] = new Uint8Array(e.data, 8); cur.got++; }
  if (cur.got < cur.total) return;
  const blob = new Blob(cur.parts, { type: 'image/jpeg' });
  cur = null;
  draw(blob);
}

function startWs(url, my) {
  if (live || my !== gen) return;
  setMsg('Direct connection blocked. Using relay…');
  const w = new WebSocket(url);
  w.binaryType = 'blob';
  ws = w;
  w.onopen = () => { if (!goLive('ws', my)) w.close(); };
  w.onmessage = e => { if (my !== gen) return; typeof e.data === 'string' ? handleCtl(e.data) : draw(e.data); };
  w.onclose = () => { if (my === gen && live && mode === 'ws') end('Disconnected.', false); };
}

async function connect() {
  const code = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 10) { shake(); return setMsg('Codes are 10 characters, like K7M2Q-X9P4R.', 'err'); }
  $('go').disabled = true; $('go').classList.add('loading');
  setMsg('Connecting…');
  const my = ++gen;
  const topic = NTFY + 'rdesk-v1-' + code.toLowerCase();
  const id = Math.random().toString(36).slice(2) + Date.now().toString(36);

  try {
    // 1) Ask the host for its network config (STUN/TURN + relay address) over the private channel
    es = new EventSource(topic + '/sse');
    await new Promise((res, rej) => {
      es.addEventListener('open', res, { once: true });
      es.onerror = () => rej(new Error('Could not reach the signaling service (ntfy.sh may be blocked on this network).'));
    });
    es.onerror = null;
    const cfg = await new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('Host not found. Check the code and that the host app is running.')), 15000);
      es.onmessage = ev => {
        let e, m;
        try { e = JSON.parse(ev.data); m = JSON.parse(e.message); } catch { return; }
        if (e.event === 'message' && m.type === 'config' && m.id === id) { clearTimeout(t); res(m); }
      };
      fetch(topic, { method: 'POST', body: JSON.stringify({ type: 'hello', id }) }).catch(rej);
    });
    if (my !== gen) return;

    // 2) Try a direct connection; fall back to the relay if it doesn't work quickly
    const fallback = () => {
      if (live || my !== gen) return;
      if (cfg.ws) startWs(cfg.ws, my);
    };
    pc = new RTCPeerConnection({ iceServers: cfg.ice });
    dc = pc.createDataChannel('screen');
    dc.binaryType = 'arraybuffer';
    dc.onmessage = e => { if (my === gen) onRtcData(e); };
    dc.onopen = () => { if (!goLive('rtc', my)) dc.close(); };
    dc.onclose = () => { if (my === gen && live && mode === 'rtc') end('Disconnected.', false); };
    pc.onconnectionstatechange = () => {
      if (my !== gen) return;
      if (['failed', 'closed'].includes(pc.connectionState)) {
        if (live && mode === 'rtc') end('Connection lost.');
        else if (!live) fallback();
      }
    };
    es.onmessage = async ev => {
      let e, m;
      try { e = JSON.parse(ev.data); m = JSON.parse(e.message); } catch { return; }
      if (e.event !== 'message' || m.id !== id || my !== gen) return;
      if (m.type === 'answer') await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
      else if (m.type === 'denied') end('The host declined the connection.');
    };

    await pc.setLocalDescription(await pc.createOffer());
    await gathered(pc);
    if (my !== gen) return;
    await fetch(topic, { method: 'POST', body: JSON.stringify({ type: 'offer', id, sdp: pc.localDescription.sdp }) });
    setMsg('Connecting to your computer…');
    timers.push(setTimeout(fallback, 8000));
    timers.push(setTimeout(() => { if (!live) end('Could not connect. Make sure the host app is running and shows "Relay tunnel ready".'); }, 45000));
  } catch (err) {
    if (my === gen) end(err.message || 'Connection failed.');
  }
}

/* ================= remote input (works over either transport) ================= */
function send(o) {
  const s = JSON.stringify(o);
  if (mode === 'rtc' && dc && dc.readyState === 'open') dc.send(s);
  else if (mode === 'ws' && ws && ws.readyState === 1) ws.send(s);
}
function switchDisplay() { switched = true; send({ t: 'switch' }); }
function pos(e) {
  const r = canvas.getBoundingClientRect();
  const s = Math.min(r.width / canvas.width, r.height / canvas.height);
  const w = canvas.width * s, h = canvas.height * s;
  const x = (e.clientX - r.left - (r.width - w) / 2) / w;
  const y = (e.clientY - r.top - (r.height - h) / 2) / h;
  return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
}
canvas.addEventListener('mousemove', e => {
  if (game) {  // game mode: mouse is captured, send relative movement (mouse look)
    relX += e.movementX; relY += e.movementY;
    if (!relPending) {
      relPending = true;
      requestAnimationFrame(() => { relPending = false; if (relX || relY) send({ t: 'rel', dx: relX, dy: relY }); relX = relY = 0; });
    }
    return;
  }
  const first = pend === null; pend = pos(e);
  if (first) requestAnimationFrame(() => { if (pend) send({ t: 'move', ...pend }); pend = null; });
});
canvas.addEventListener('mousedown', e => {
  e.preventDefault(); canvas.focus();
  send(game ? { t: 'btn', a: 'down', b: e.button } : { t: 'mouse', a: 'down', b: e.button, ...pos(e) });
});
canvas.addEventListener('mouseup', e => {
  e.preventDefault();
  send(game ? { t: 'btn', a: 'up', b: e.button } : { t: 'mouse', a: 'up', b: e.button, ...pos(e) });
});
canvas.addEventListener('blur', () => send({ t: 'release' }));  // never leave keys stuck down on the host

// Game mode = captured mouse (relative movement) + hardware-style keyboard input
function toggleGame() {
  if (document.pointerLockElement === canvas) return document.exitPointerLock();
  const p = canvas.requestPointerLock({ unadjustedMovement: true });  // raw mouse, no OS acceleration (Chrome/Edge)
  if (p && p.catch) p.catch(() => canvas.requestPointerLock());
}
document.addEventListener('pointerlockchange', () => {
  game = document.pointerLockElement === canvas; relX = relY = 0;
  if (live) toast(game ? 'Game mode ON · Ctrl+4 or Esc to exit' : 'Game mode off');
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); send({ t: 'wheel', dy: e.deltaY }); }, { passive: false });

// Shortcuts (handled here, not sent to the host): Ctrl+1 switch display, Ctrl+2 fullscreen, Ctrl+3 disconnect, Ctrl+4 game mode
const digit = e => (String(e.code).match(/^(?:Digit|Numpad)([1-4])$/) || [])[1];
async function toggleFullscreen() {
  if (document.fullscreenElement) return document.exitFullscreen();
  await $('stream').requestFullscreen();
  try { await navigator.keyboard?.lock?.(); } catch {}  // lets Alt+Tab, Esc etc. reach the host (Chrome/Edge)
  canvas.focus();
}
canvas.addEventListener('keydown', e => {
  e.preventDefault();
  const d = e.ctrlKey && digit(e);
  if (d) {
    swallowed.add(e.code);
    if (!e.repeat) {
      if (d === '1') switchDisplay();
      else if (d === '2') toggleFullscreen().catch(() => {});
      else if (d === '3') end('Disconnected.', false);
      else if (d === '4') toggleGame();
    }
    return;
  }
  send({ t: 'key', a: 'down', k: e.key, c: e.code, g: game });
});
canvas.addEventListener('keyup', e => {
  e.preventDefault();
  if (swallowed.delete(e.code)) return;
  send({ t: 'key', a: 'up', k: e.key, c: e.code, g: game });
});

/* ================= form ================= */
$('go').onclick = connect;
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
$('code').addEventListener('input', e => {
  const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
  e.target.value = v.length > 5 ? v.slice(0, 5) + '-' + v.slice(5) : v;
});
</script>
